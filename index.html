<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker with Weekly Streaks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>My Daily Routine</h1>
            <div class="week-navigation">
                <button id="prev-week">← Previous Week</button>
                <button id="current-week-btn">Back to This Week</button>
                <button id="next-week">Next Week →</button>
            </div>
            <div class="current-week-display" id="week-range-text">Loading dates...</div>
        </header>

        <section class="habit-form-section">
            <form id="add-habit-form">
                <input type="text" id="habit-input" placeholder="Type a habit name (e.g., Exercise, Read 30 min)" required autocomplete="off">
                <button type="submit">Add Habit</button>
            </form>
        </section>

        <main>
            <div id="empty-state" class="empty-state">
                <p>No habits tracked yet! Add your first daily habit above to build your streak. 🌱</p>
            </div>

            <div id="tracker-grid-container" class="grid-scroll-wrapper" style="display: none;">
                <table class="tracker-table">
                    <thead>
                        <tr id="grid-header-row">
                            <th>Habit</th>
                            <th>Streak</th>
                            </tr>
                    </thead>
                    <tbody id="grid-body">
                        </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
